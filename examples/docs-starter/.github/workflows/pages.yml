# Builds the site with a prebuilt tryck binary and deploys it to GitHub
# Pages. Enable Pages with "GitHub Actions" as the source in the
# repository settings.
name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  TRYCK_VERSION: v0.8.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: pages
        uses: actions/configure-pages@v6
      - name: Install tryck
        run: curl -sSL "https://github.com/Pinta365/tryck/releases/download/${TRYCK_VERSION}/tryck_linux_amd64.tar.gz" | tar xz tryck
      - name: Build
        # base_url is https://<user>.github.io/<repo> (or your custom domain).
        run: ./tryck build --base-url "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
