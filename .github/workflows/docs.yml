# Builds the docs site in docs/ with tryck and deploys it to GitHub Pages.
# Pull requests build it in ci.yml.
#
# The site documents the latest release, so it deploys when a release is
# tagged, not on every push to main. To publish a docs-only fix between
# releases, run this workflow by hand on main (Actions > Docs > Run
# workflow); that also publishes any unreleased changes documented there.
name: Docs

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, for the "Last updated" dates
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - id: pages
        uses: actions/configure-pages@v6
      - name: Build
        run: go run ./cmd/tryck build --config docs/tryck.config.yaml --strict --base-url "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
