site:
  title: tryck
  description: A single-binary static site generator for technical documentation.
  baseUrl: "https://tryck.pinta.land/"

build:
  lastUpdated: true

plugins:
  llmsTxt:
    full: true
    optional: [/releases/]
  social:
    image: /img/card.jpg
    imageAlt: "A terminal prompt reading $ tryck, with the line Docs from Markdown, in one binary."

theme:
  path: themes/pinta
  nav:
    - title: GitHub
      url: https://github.com/Pinta365/tryck
  footer: "MIT licensed · Built with [tryck](https://github.com/Pinta365/tryck) · [llms.txt](/llms.txt) for AI tools"
  css: [/css/docs.css]
  editUrl: https://github.com/Pinta365/tryck/edit/main/docs/
  params:
    brandSuffix: docs
