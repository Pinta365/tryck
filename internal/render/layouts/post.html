{{ define "main" }}
<main class="content">
<article class="post">
{{- if not .Page.TitleInBody }}
<h1>{{ .Page.Title }}</h1>
{{- end }}
{{- with dateFormat "" .Page.Date }}
<p class="post-date"><time datetime="{{ dateFormat "2006-01-02" $.Page.Date }}">{{ . }}</time>
{{- with $.Page.Data.readingTime }} · <span class="reading-time">{{ . }} min read</span>{{ end }}</p>
{{- end }}
{{ .Content }}
</article>
</main>
{{ end }}
