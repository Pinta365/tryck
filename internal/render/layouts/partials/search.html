{{- /* The search box. Hidden until js/search.js runs, so pages without JavaScript show no dead button. */ -}}
{{- with .SearchIndex }}
<div class="search" data-index="{{ relURL . }}" hidden>
<button type="button" class="search-open" aria-haspopup="dialog" aria-label="Search"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.75"/><path d="m11 11 4 4" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span>Search</span><kbd>/</kbd></button>
<dialog class="search-dialog" aria-label="Search">
<div class="search-bar" role="search">
<input type="search" class="search-input" placeholder="Search" aria-label="Search" role="combobox" aria-controls="search-results" aria-expanded="false" aria-autocomplete="list" autocomplete="off" spellcheck="false">
<button type="button" class="search-close">Esc</button>
</div>
<p class="search-status" aria-live="polite"></p>
<ul id="search-results" class="search-results" role="listbox" aria-label="Results"></ul>
</dialog>
</div>
{{- end -}}
