<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>document.documentElement.classList.add("js")</script>
<title>Page not found · Themed</title>
<link rel="stylesheet" href="/themed/css/tryck.css">
<link rel="stylesheet" href="/themed/css/chroma.css">
<link rel="stylesheet" href="/themed/css/acme.css">
<style>
:root { --accent: #0b7a5a; }
:root[data-theme="dark"] { --accent: color-mix(in srgb, #0b7a5a 60%, white); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --accent: color-mix(in srgb, #0b7a5a 60%, white); } }
</style>
<script src="/themed/js/search.js" defer></script>
</head>
<body>
<header class="site-header">
<a class="site-title" href="/themed/"><img class="site-logo" src="/themed/img/logo.svg" alt=""><span>Themed</span></a>
<nav class="site-nav" aria-label="Links">
<a href="https://github.com/Pinta365/tryck">GitHub</a>
<a href="/themed/guide/">Guide</a>
</nav>
<div class="search" data-index="/themed/search-index.json" hidden>
<button type="button" class="search-open" aria-haspopup="dialog" aria-label="Search"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.75"/><path d="m11 11 4 4" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg><span>Search</span><kbd>/</kbd></button>
<dialog class="search-dialog" aria-label="Search">
<div class="search-bar" role="search">
<input type="search" class="search-input" placeholder="Search" aria-label="Search" role="combobox" aria-controls="search-results" aria-expanded="false" aria-autocomplete="list" autocomplete="off" spellcheck="false">
<button type="button" class="search-close">Esc</button>
</div>
<p class="search-status" aria-live="polite"></p>
<ul id="search-results" class="search-results" role="listbox" aria-label="Results"></ul>
</dialog>
</div>
<button type="button" class="nav-toggle" aria-expanded="false" hidden>Menu</button>
</header>


<main class="content">
<h1>Page not found</h1>
<p>The page you are looking for does not exist. <a href="/themed/">Go to the home page</a>.</p>
</main>

<footer class="site-footer acme">Acme docs · Made with <strong>acme</strong>. <a href="/themed/">Home</a></footer>

<script>


const tryckScrollables = () => {
  for (const pre of document.querySelectorAll("pre")) {
    if (pre.scrollWidth > pre.clientWidth) pre.tabIndex = 0;
    else pre.removeAttribute("tabindex");
  }
};
tryckScrollables();
addEventListener("resize", tryckScrollables);

if (navigator.clipboard) {
  for (const pre of document.querySelectorAll("pre:not(.mermaid)")) {
    const wrap = document.createElement("div");
    wrap.className = "code-block";
    pre.replaceWith(wrap);
    wrap.append(pre);
    const button = document.createElement("button");
    button.type = "button";
    button.className = "copy-code";
    button.textContent = "Copy";
    button.setAttribute("aria-label", "Copy code");
    button.addEventListener("click", async () => {
      const code = pre.cloneNode(true);
      code.querySelectorAll(".ln, .lnt").forEach((n) => n.remove());
      try {
        await navigator.clipboard.writeText(code.textContent.replace(/\n$/, ""));
        button.textContent = "Copied";
      } catch {
        button.textContent = "Failed";
      }
      setTimeout(() => (button.textContent = "Copy"), 2000);
    });
    wrap.append(button);
  }
}

(() => {
  const toggle = document.querySelector(".nav-toggle");
  if (!toggle || !document.querySelector(".sidebar")) return;
  toggle.hidden = false;
  document.body.classList.add("nav-collapsed");
  toggle.addEventListener("click", () => {
    const open = document.body.classList.toggle("nav-collapsed") === false;
    toggle.setAttribute("aria-expanded", String(open));
  });
})();

document.querySelector(".theme-toggle")?.addEventListener("click", () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("tryck-theme", root.dataset.theme); } catch {}
});

(() => {
  const KEY = "tryck-tabs:";
  const tabsOf = (el) => [...el.querySelectorAll(":scope > .tab-list > [role=tab]")];
  function select(el, i, sync) {
    const buttons = tabsOf(el);
    const panels = el.querySelectorAll(":scope > [role=tabpanel]");
    buttons.forEach((b, j) => {
      b.setAttribute("aria-selected", String(i === j));
      b.tabIndex = i === j ? 0 : -1;
      if (panels[j]) panels[j].hidden = i !== j;
    });
    tryckScrollables();
    const group = el.dataset.group;
    if (!sync || !group) return;
    const label = buttons[i].textContent;
    try { localStorage.setItem(KEY + group, label); } catch {}
    document.querySelectorAll(".tabs[data-group]").forEach((other) => {
      if (other !== el && other.dataset.group === group) selectLabel(other, label);
    });
  }
  function selectLabel(el, label) {
    const i = tabsOf(el).findIndex((b) => b.textContent === label);
    if (i >= 0) select(el, i, false);
  }
  document.querySelectorAll(".tabs").forEach((el) => {
    const list = el.querySelector(":scope > .tab-list");
    if (!list) return;
    list.hidden = false;
    el.classList.add("tabs-js");
    const buttons = tabsOf(el);
    buttons.forEach((b, i) => {
      b.addEventListener("click", () => select(el, i, true));
      b.addEventListener("keydown", (e) => {
        const n = buttons.length;
        const j = { ArrowRight: (i + 1) % n, ArrowLeft: (i - 1 + n) % n, Home: 0, End: n - 1 }[e.key];
        if (j === undefined) return;
        e.preventDefault();
        select(el, j, true);
        buttons[j].focus();
      });
    });
    select(el, 0, false);
    if (el.dataset.group) {
      try { const saved = localStorage.getItem(KEY + el.dataset.group); if (saved) selectLabel(el, saved); } catch {}
    }
  });
})();
</script>
</body>
</html>
