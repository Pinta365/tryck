<style>
:root { --fg: #1f2328; --muted: #59636e; --bg: #fff; --line: #d1d9e0; --link: #0969da; --code-bg: #f6f8fa; }
@media (prefers-color-scheme: dark) {
  :root { --fg: #e6edf3; --muted: #9198a1; --bg: #0d1117; --line: #3d444d; --link: #4493f8; --code-bg: #151b23; }
}
* { box-sizing: border-box; }
body { margin: 0; color: var(--fg); background: var(--bg); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--link); }
.site-header { padding: 0.75rem 1rem; border-bottom: 1px solid var(--line); }
.site-header a { color: var(--fg); font-weight: 600; text-decoration: none; }
main { max-width: 48rem; margin: 0 auto; padding: 1rem; }
pre, code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9em; }
pre { padding: 1rem; overflow-x: auto; background: var(--code-bg); border-radius: 6px; }
:not(pre) > code { padding: 0.1em 0.3em; background: var(--code-bg); border-radius: 4px; }
table { border-collapse: collapse; }
th, td { padding: 0.4rem 0.75rem; border: 1px solid var(--line); }
img { max-width: 100%; }
</style>
</head>
