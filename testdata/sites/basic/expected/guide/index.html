<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guide · Basic Docs</title>
<meta name="description" content="Golden test fixture.">
<link rel="stylesheet" href="/basic/css/tryck.css">
<link rel="stylesheet" href="/basic/css/chroma.css">
<script>try { const t = localStorage.getItem("tryck-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
</head>
<body>
<header class="site-header">
<a class="site-title" href="/basic/"><span>Basic Docs</span></a>
<button type="button" class="theme-toggle" aria-label="Switch between light and dark" title="Switch between light and dark"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg></button>
<button type="button" class="nav-toggle" aria-expanded="false" hidden>Menu</button>
</header>


<div class="layout">
<nav class="sidebar" aria-label="Site"><ul>
<li class="in-path"><a href="/basic/guide/" aria-current="page">Guide</a><ul>
<li><a href="/basic/guide/setup/">Setup &amp; install</a></li>
<li><a href="/basic/guide/directives/">Directives</a></li>
</ul></li>
</ul>
</nav>

<main class="content">
<article class="doc">
<h1>Guide</h1>
<p>The guide section index.</p>

</article>
<nav class="pager" aria-label="Previous and next page">
<a class="pager-prev" rel="prev" href="/basic/"><span>Previous</span>Welcome to Basic</a>
<a class="pager-next" rel="next" href="/basic/guide/setup/"><span>Next</span>Setup &amp; install</a>
</nav>
</main>


</div>



<script>

(() => {
  const toggle = document.querySelector(".nav-toggle");
  if (!toggle || !document.querySelector(".sidebar")) return;
  toggle.hidden = false;
  document.body.classList.add("nav-collapsed");
  toggle.addEventListener("click", () => {
    const open = document.body.classList.toggle("nav-collapsed") === false;
    toggle.setAttribute("aria-expanded", String(open));
  });
})();

document.querySelector(".theme-toggle")?.addEventListener("click", () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("tryck-theme", root.dataset.theme); } catch {}
});

(() => {
  const KEY = "tryck-tabs:";
  const tabsOf = (el) => [...el.querySelectorAll(":scope > .tab-list > [role=tab]")];
  function select(el, i, sync) {
    const buttons = tabsOf(el);
    const panels = el.querySelectorAll(":scope > [role=tabpanel]");
    buttons.forEach((b, j) => {
      b.setAttribute("aria-selected", String(i === j));
      b.tabIndex = i === j ? 0 : -1;
      if (panels[j]) panels[j].hidden = i !== j;
    });
    const group = el.dataset.group;
    if (!sync || !group) return;
    const label = buttons[i].textContent;
    try { localStorage.setItem(KEY + group, label); } catch {}
    document.querySelectorAll(".tabs[data-group]").forEach((other) => {
      if (other !== el && other.dataset.group === group) selectLabel(other, label);
    });
  }
  function selectLabel(el, label) {
    const i = tabsOf(el).findIndex((b) => b.textContent === label);
    if (i >= 0) select(el, i, false);
  }
  document.querySelectorAll(".tabs").forEach((el) => {
    const list = el.querySelector(":scope > .tab-list");
    if (!list) return;
    list.hidden = false;
    el.classList.add("tabs-js");
    const buttons = tabsOf(el);
    buttons.forEach((b, i) => {
      b.addEventListener("click", () => select(el, i, true));
      b.addEventListener("keydown", (e) => {
        const n = buttons.length;
        const j = { ArrowRight: (i + 1) % n, ArrowLeft: (i - 1 + n) % n, Home: 0, End: n - 1 }[e.key];
        if (j === undefined) return;
        e.preventDefault();
        select(el, j, true);
        buttons[j].focus();
      });
    });
    select(el, 0, false);
    if (el.dataset.group) {
      try { const saved = localStorage.getItem(KEY + el.dataset.group); if (saved) selectLabel(el, saved); } catch {}
    }
  });
})();
</script>
</body>
</html>
